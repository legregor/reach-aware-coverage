otel.traces.exporter=otlp
otel.logs.exporter=none
otel.metrics.exporter=none
otel.exporter.otlp.endpoint=http://host.docker.internal:4317
otel.exporter.otlp.protocol=grpc
otel.traces.sampler=always_on

# debug
otel.javaagent.debug=true
otel.javaagent.enabled=true
otel.javaagent.log.level=debug

# Disable instrumentation that is not needed for the tests
otel.instrumentation.spring-data.enabled=false
otel.instrumentation.jdbc.enabled=false
otel.instrumentation.mongo.enabled=false

# shrink the BatchSpanProcessor so short-lived test containers flush
otel.bsp.schedule.delay=50
otel.bsp.max.export.batch.size=10
otel.bsp.max.queue.size=20
